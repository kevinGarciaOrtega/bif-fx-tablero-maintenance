name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda artifact
        run: |
          mkdir -p dist-package
          cp package.json package-lock.json dist-package/
          cp -r dist dist-package/
          if [ -d node_modules ]; then cp -r node_modules dist-package/; fi
          cd dist-package
          zip -r ../lambda-package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Lambda - listarVolatilidad
        run: |
          FUNCTION="bif-fx-param-mantainaice-dev-listarVolatilidad"
          echo "Deploying $FUNCTION..."

          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://lambda-package.zip \
            --publish

          echo "Waiting for $FUNCTION to finish updating..."
          aws lambda wait function-updated --function-name "$FUNCTION"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --handler dist/index.handler \
            --runtime nodejs20.x

          echo "$FUNCTION deployed successfully"

      - name: Deploy Lambda - actualizarVolatilidad
        run: |
          FUNCTION="bif-fx-param-mantainaice-dev-actualizarVolatilidad"
          echo "Deploying $FUNCTION..."

          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://lambda-package.zip \
            --publish

          echo "Waiting for $FUNCTION to finish updating..."
          aws lambda wait function-updated --function-name "$FUNCTION"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --handler dist/index.handler \
            --runtime nodejs20.x

          echo "$FUNCTION deployed successfully"
