name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda artifact
        run: |
          mkdir -p dist-package
          cp package.json package-lock.json dist-package/
          cp -r dist dist-package/
          if [ -d node_modules ]; then cp -r node_modules dist-package/; fi
          cd dist-package
          zip -r ../lambda-package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get AWS account id
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Deploy to AWS Lambda
        env:
          AWS_FUNCTION_NAME: ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Function secret: $AWS_FUNCTION_NAME"
          echo "Region secret: $AWS_REGION"

          if [[ -z "$AWS_FUNCTION_NAME" || -z "$AWS_REGION" ]]; then
            echo "ERROR: Define AWS_LAMBDA_FUNCTION_NAME y AWS_REGION en GitHub Secrets"
            exit 1
          fi

          if [[ "$AWS_FUNCTION_NAME" == arn:aws:lambda:* ]]; then
            FUNCTION_REF="$AWS_FUNCTION_NAME"
          else
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            FUNCTION_REF="arn:aws:lambda:${AWS_REGION}:${ACCOUNT_ID}:function:${AWS_FUNCTION_NAME}"
          fi

          echo "Using Lambda ARN: $FUNCTION_REF"

          aws lambda get-function --function-name "$FUNCTION_REF" >/dev/null || {
            echo "ERROR: No existe esa función Lambda en esta cuenta: $FUNCTION_REF"
            exit 254
          }

          aws lambda update-function-code \
            --function-name "$FUNCTION_REF" \
            --zip-file fileb://lambda-package.zip \
            --publish

          echo "Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name "$FUNCTION_REF"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_REF" \
            --handler dist/index.handler \
            --runtime nodejs20.x
